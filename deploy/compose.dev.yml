name: pam

services:
  postgres:
    image: postgres:18

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    
    networks:
      - db-network

  pgbouncer:
    image: edoburu/pgbouncer

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}

      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256

      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20

    networks:
      - db-network
      - app-network
    
    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$DB_PASSWORD" psql -h 127.0.0.1 -p "$$LISTEN_PORT" -U "$$DB_USER" -d "$$DB_NAME" -c "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine
    command: 
      [
        "redis-server",
        "--requirepass", 
        "${REDIS_PASSWORD}"
      ]
    
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    networks:
      - app-network

    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev

    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_SCHEMA: public
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:8080:8080"
    
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

    networks:
      - app-network
      - keycloak-db-network

    restart: unless-stopped

  keycloak-postgres:
    image: postgres:18
    
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    
    volumes:
      - keycloak_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - keycloak-db-network

    restart: unless-stopped

  # app:
  #   build: ./my-app
  #   environment:
  #     DATABASE_URL: postgresql://postgres:mysecretpassword@db:5432/mydb
  #   networks:
  #     - app-network
  #   depends_on:
  #     - db

volumes:
  postgres_data:
  keycloak_data:

networks:
  db-network:
    driver: bridge
    internal: true
  
  app-network:
    driver: bridge

  keycloak-db-network:
    driver: bridge
    internal: true
