name: pam

services:
  postgres:
    image: postgres:18

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro

  redis:
    image: redis:8.8.3-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_SCHEMA: public
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"

    volumes:
      - ./keycloak/:/opt/keycloak/data/import:ro

    ports:
      - "127.0.0.1:8080:8080"

    depends_on:
      keycloak-postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

    restart: unless-stopped

  keycloak-postgres:
    image: postgres:18

    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - keycloak_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  vault:
    image: hashicorp/vault:2.1.1

    cap_add:
      - IPC_LOCK

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    ports:
      - "127.0.0.1:8200:8200"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1'
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  migrator:
    build:
      context: ../src/Backend
      dockerfile: Dockerfile
      target: migrator
    environment:
      DB_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../src/Backend
      dockerfile: Dockerfile
      target: final

    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${APP_DB_USER};Password=${APP_DB_PASSWORD};Pooling=true;SSL Mode=Disable"
      Redis__Host: redis
      Redis__Port: "6379"
      Redis_User: default
      Redis__Password: ${REDIS_PASSWORD}
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET}
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/pam/.well-known/openid-configuration"

    ports:
      - "127.0.0.1:${API_PORT:-8090}:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "--max-time",
          "3",
          "http://127.0.0.1:8080/health/ready"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped

volumes:
  postgres_data:
  keycloak_data:
